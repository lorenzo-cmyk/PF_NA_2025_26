services:
  # =============================================================
  # EXTREME-EDGE
  # =============================================================
  extreme-edge-camera:
    build:
      context: ../services/camera
    image: watchedge-camera
    container_name: extreme-edge-camera
    environment:
      MQTT_HOST: edge-mosquitto
      MQTT_PORT: 1883
      EDGE_ID: a3f1b2c4-0000-0000-0000-000000000001
      CAMERA_ID: 7c8d9e0f-0000-0000-0000-000000000001
    ports:
      - "8080:8080"
    networks:
      - edge-net
    depends_on:
      edge-mosquitto:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8080/health")''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # =============================================================
  # EDGE
  # =============================================================
  edge-mosquitto:
    image: eclipse-mosquitto
    container_name: edge-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - edge-mosquitto-data:/mosquitto/data
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - edge-net
      - cloud-net
    depends_on:
      cloud-mosquitto:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -t '$$SYS/broker/version' -C 1 > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  edge-postgresql:
    image: postgis/postgis:17-3.5
    container_name: edge-postgresql
    environment:
      POSTGRES_DB: watchedge-db
      POSTGRES_USER: watchedge
      POSTGRES_PASSWORD: watchedge
    volumes:
      - edge-pgdata:/var/lib/postgresql
      - ../services/database-postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - edge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchedge -d watchedge-db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  edge-rustfs-init:
    image: alpine
    container_name: edge-rustfs-init
    volumes:
      - edge-objectdata:/data
    command: >
      sh -c "
        chown -R 10001:10001 /data &&
        echo 'Volume permissions fixed' &&
        exit 0
      "
    restart: "no"

  edge-rustfs:
    image: rustfs/rustfs:latest
    container_name: edge-rustfs
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_VOLUMES: /data/rustfs
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: watchedge
      RUSTFS_SECRET_KEY: watchedge-pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - edge-objectdata:/data/rustfs
    networks:
      - edge-net
    depends_on:
      edge-rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  edge-processing-service:
    build:
      context: ../services/processing-service
    image: watchedge-processing-service
    container_name: edge-processing-service
    environment:
      SERVICE_MODE: EDGE
      MQTT_HOST: edge-mosquitto
      MQTT_PORT: 1883
      DATABASE_URL: postgresql://watchedge:watchedge@edge-postgresql:5432/watchedge-db
      OBJECT_STORAGE_URL: http://edge-rustfs:9000
      S3_ACCESS_KEY: watchedge
      S3_SECRET_KEY: watchedge-pass
      S3_BUCKET: watchedge-images
      MQTT_CLIENT_ID: edge-processing-service
      WEB_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    networks:
      - edge-net
      - cloud-net
    depends_on:
      edge-mosquitto:
        condition: service_healthy
      edge-postgresql:
        condition: service_healthy
      edge-rustfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/health")''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  edge-grafana:
    image: grafana/grafana
    container_name: edge-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: watchedge-pass
      GF_SECURITY_ADMIN_USER: watchedge
      GF_INSTALL_PLUGINS: grafana-postgresql-datasource
      GF_CONFIG_DB_URL: edge-postgresql:5432
      GF_CONFIG_DB_USER: watchedge
      GF_CONFIG_DB_PASSWORD: watchedge
      GF_CONFIG_DB_NAME: watchedge-db
    ports:
      - "3000:3000"
    volumes:
      - edge-grafana-storage:/var/lib/grafana
      - ../services/dashboard-grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../services/dashboard-grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../services/dashboard-grafana/dashboard_model.json:/var/lib/grafana/dashboards/dashboard_model.json:ro
    networks:
      - edge-net
    depends_on:
      edge-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # =============================================================
  # CLOUD
  # =============================================================
  cloud-mosquitto:
    image: eclipse-mosquitto
    container_name: cloud-mosquitto
    ports:
      - "1884:1883"
    volumes:
      - cloud-mosquitto-data:/mosquitto/data
      - ./cloud/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - cloud-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -t '$$SYS/broker/version' -C 1 > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cloud-postgresql:
    image: postgis/postgis:17-3.5
    container_name: cloud-postgresql
    environment:
      POSTGRES_DB: watchedge-db
      POSTGRES_USER: watchedge
      POSTGRES_PASSWORD: watchedge
    volumes:
      - cloud-pgdata:/var/lib/postgresql
      - ../services/database-postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cloud-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchedge -d watchedge-db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloud-rustfs-init:
    image: alpine
    container_name: cloud-rustfs-init
    volumes:
      - cloud-objectdata:/data
    command: >
      sh -c "
        chown -R 10001:10001 /data &&
        echo 'Volume permissions fixed' &&
        exit 0
      "
    restart: "no"

  cloud-rustfs:
    image: rustfs/rustfs:latest
    container_name: cloud-rustfs
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_VOLUMES: /data/rustfs
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: watchedge
      RUSTFS_SECRET_KEY: watchedge-pass
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - cloud-objectdata:/data/rustfs
    networks:
      - cloud-net
    depends_on:
      cloud-rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloud-processing-service:
    image: watchedge-processing-service
    container_name: cloud-processing-service
    environment:
      SERVICE_MODE: CLOUD
      MQTT_HOST: cloud-mosquitto
      MQTT_PORT: 1883
      DATABASE_URL: postgresql://watchedge:watchedge@cloud-postgresql:5432/watchedge-db
      OBJECT_STORAGE_URL: http://cloud-rustfs:9000
      S3_ACCESS_KEY: watchedge
      S3_SECRET_KEY: watchedge-pass
      S3_BUCKET: watchedge-images
      MQTT_CLIENT_ID: cloud-processing-service
      WEB_BASE_URL: http://localhost:8001
    ports:
      - "8001:8000"
    networks:
      - cloud-net
    depends_on:
      cloud-mosquitto:
        condition: service_healthy
      cloud-postgresql:
        condition: service_healthy
      cloud-rustfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/health")''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cloud-grafana:
    image: grafana/grafana
    container_name: cloud-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: watchedge-pass
      GF_SECURITY_ADMIN_USER: watchedge
      GF_INSTALL_PLUGINS: grafana-postgresql-datasource
      GF_CONFIG_DB_URL: cloud-postgresql:5432
      GF_CONFIG_DB_USER: watchedge
      GF_CONFIG_DB_PASSWORD: watchedge
      GF_CONFIG_DB_NAME: watchedge-db
    ports:
      - "3001:3000"
    volumes:
      - cloud-grafana-storage:/var/lib/grafana
      - ../services/dashboard-grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../services/dashboard-grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../services/dashboard-grafana/dashboard_model.json:/var/lib/grafana/dashboards/dashboard_model.json:ro
    networks:
      - cloud-net
    depends_on:
      cloud-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  edge-net:
    name: watchedge-edge
  cloud-net:
    name: watchedge-cloud

volumes:
  edge-pgdata:
  edge-mosquitto-data:
  edge-objectdata:
  edge-grafana-storage:
  cloud-pgdata:
  cloud-mosquitto-data:
  cloud-objectdata:
  cloud-grafana-storage:
