services:
  postgresql:
    image: postgres
    container_name: edge-postgresql
    environment:
      POSTGRES_DB: gBOAR
      POSTGRES_USER: gBOAR
      POSTGRES_PASSWORD: gBOAR
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../../services/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto
    container_name: edge-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  camera-emulator:
    build:
      context: ../../services/camera-emulator
    container_name: edge-camera-emulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      EDGE_ID: edge_01
      CAMERA_ID: cam_01
    ports:
      - "8080:8080"
    depends_on:
      - mosquitto
    restart: unless-stopped

  processing-service:
    build:
      context: ../../services/processing-service
    container_name: edge-processing-service
    environment:
      SERVICE_MODE: EDGE
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      DATABASE_URL: postgresql://gBOAR:gBOAR@postgresql:5432/gBOAR
      OBJECT_STORAGE_URL: http://object-storage:9000
      S3_ACCESS_KEY: gBOAR
      S3_SECRET_KEY: gBOAR
      S3_BUCKET: gboar-images
    ports:
      - "8000:8000"
    depends_on:
      - mosquitto
      - postgresql
      - object-storage
    restart: unless-stopped

  object-storage:
    image: rustfs/rustfs:latest
    container_name: edge-object-storage
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_VOLUMES: /data/rustfs
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: gBOAR
      RUSTFS_SECRET_KEY: gBOAR
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - objectdata:/data/rustfs
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  object-storage-init:
    image: alpine
    container_name: edge-object-storage-init
    volumes:
      - objectdata:/data
    command: >
      sh -c "
        chown -R 10001:10001 /data &&
        echo 'Volume permissions fixed' &&
        exit 0
      "
    restart: "no"

volumes:
  pgdata:
  mosquitto-data:
  objectdata:
