[project]
name = "homepage"
version = "0.1.0"
description = "gBOAR homepage – landing page with links to all system components."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "black>=26.1.0",
    "pylint>=4.0.5",
]

[project.scripts]
homepage = "homepage.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
