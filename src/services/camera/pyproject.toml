[project]
name = "camera"
version = "0.1.0"
description = "WatchEdge camera service – real inference and management WebUI."
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.42.0",
    "paho-mqtt>=2.1.0",
    "jinja2>=3.1.6",
    "requests>=2.32.5",
    "opencv-python>=4.13.0.92",
    "numpy>=2.4.3",
    "onnxruntime>=1.24.4",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.13.1",
]

[project.scripts]
camera = "camera.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.15.6"]
