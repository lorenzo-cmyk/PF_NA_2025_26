[project]
name = "camera"
version = "0.1.0"
description = "WatchEdge camera service – real inference and management WebUI for the gBOAR system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "paho-mqtt>=2.1",
    "jinja2>=3.1",
    "requests>=2.31",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "python-dotenv>=1.0",
]

[project.scripts]
camera = "camera.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
