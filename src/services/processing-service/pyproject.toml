[project]
name = "processing-service"
version = "0.1.0"
description = "Unified Edge/Cloud processing service for the WatchEdge wildlife detection system."
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.42.0",
    "paho-mqtt>=2.1.0",
    "sqlmodel>=0.0.37",
    "psycopg2-binary>=2.9.11",
    "requests>=2.32.5",
    "boto3>=1.42.70",
    "pydantic-settings>=2.13.1",
]

[project.scripts]
processing-service = "processing_service.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.15.6"]
